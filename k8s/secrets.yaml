apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: openuba
type: Opaque
stringData:
  password: gacwr
---
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: openuba
type: Opaque
stringData:
  database-url: postgresql://gacwr:gacwr@postgres:5432/openuba
  # required: JWT signing key. REPLACE this placeholder before deploying — generate
  # with `openssl rand -hex 32`. the backend refuses to start if unset. (issue #149)
  jwt-secret-key: "REPLACE_ME_WITH_openssl_rand_hex_32_value_0123456789abcdef"

